<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STORE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


</head>
<style>

    body {
        height: 200dhv;
        width: 100dvw;
        display: flex;
        flex-direction: column;
        margin: 0
    }

    header {
        flex: 1;
        background-color: #fff;
        padding-left: 50px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
        font-family: 'Poppins', sans-serif;

        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
    }

    nav>a {
        text-decoration: none;
        color: #000;
        padding-right: 20px
    }

    nav>a:hover{
        text-decoration-thickness: 30px;
        text-underline-offset: 5px;
        text-decoration: underline;
    }

    main{
        display: flex;
        flex-direction: column;
    }


    .underhead{
        flex: 1;
        display: flex;
        flex-direction: row;
        gap: 20px;
        justify-content: center;
    }

    .underhead>a{
        text-decoration: none;
        color: black;
        font-size: 25px;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    .underhead>a:hover{
        text-decoration: underline 2px solid;
    }

    .kop{
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 15px;
        display: flex;
        flex-direction: row;
        justify-content: center;
    }

    .catalog{
        flex: 3;
        flex-direction: row;
        display: flex;
        justify-content: center;
    }

    .catalog>.first{
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .catalog>.second{
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .catalog>.third{
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .catalog>.first>.harga{
        color: red;
        text-decoration: line-through;
    }

</style>

<body>
    <header>
        <img src="XM.webp" alt="Logo XIAOMAY" width="100px">
        <h2>XIAOMAY</h2>
        <nav>
            <a href="home.html">HOME</a>
            <a href="store.html">STORE</a>
            <a href="about.html">ABOUT</a>
        </nav>
    </header>

    <main>
            <section class="underhead">
                <a href="#">MAN</a>
                <a href="#">WOMAN</a>
                <a href="#">KIDS</a>
            </section>

            <section class="kop">
                <p>Booster Outfit is here, Shop Now.</p>
            </section>
        
            <section class="catalog">
                <section class="first">
                    <img src="Store1.webp" alt="Kaos Pertama" width="400px">
                    <p>T-Shirt Vintage BoutBoss Shrap Life</p>
                    <p class="harga">Rp 300.000,-</p>
                </section>

                <section class="second">
                    <img src="Store1.webp" alt="Kaos Kedua" width="400px">
                    <p>T-Shirt Vintage BoutBoss Shrap Life</p>
                    <p>Rp 135.000,-</p>
                </section>

                <section class="third">
                    <img src="Store1.webp" alt="Kaos Ketiga" width="400px">
                    <p>T-Shirt Vintage BoutBoss Shrap Life</p>
                    <p>Rp 120.000,-</p>
                </section>
            </section>
    </main>

</body>

</html>
